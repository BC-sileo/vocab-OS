<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <title>Vocab OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">VOCAB OS · v0.1</div>
      <h1>単語を、構造から覚える。</h1>
    </div>
    <button id="tocBtn" class="icon-btn" aria-label="目次">☰</button>
  </header>

  <main>
    <section class="controls card">
      <label>1ページの語数
        <select id="pageSize"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
      </label>
      <label>ページ
        <select id="pageSelect"></select>
      </label>
      <div class="actions">
        <button id="shuffleBtn">ページ内シャッフル</button>
        <button id="resetBtn" class="subtle">順序を戻す</button>
      </div>
    </section>

    <section class="session card">
      <div><strong id="progressText">0 / 0語</strong><span id="pageText"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
      <p class="hint">赤い境界線より下が隠れます。思い出したら線を動かして答え合わせ。</p>
    </section>

    <section id="wordList" class="word-list" aria-live="polite"></section>
  </main>

  <aside id="toc" class="toc" aria-hidden="true">
    <div class="toc-panel">
      <div class="toc-head"><strong>このページ</strong><button id="tocClose" class="icon-btn">×</button></div>
      <div id="tocItems"></div>
    </div>
  </aside>

  <div id="sheetLine" class="sheet-line" role="slider" aria-label="赤シート境界" tabindex="0">
    <span>↕</span>
  </div>

  <script src="app.js"></script>
</body>
</html>

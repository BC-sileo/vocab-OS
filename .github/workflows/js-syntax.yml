name: JavaScript syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag store
        run: node --check tag-store.js
      - name: Check tag UI
        run: node --check tag-ui.js
      - name: Check app
        run: node --check app.js
      - name: Check word notes
        run: node --check word-notes.js
      - name: Check learning
        run: node --check learning.js
      - name: Check other JavaScript
        run: |
          node --check fsrs-loader.js
          node --check theme.js
          node --check notifications.js
          node --check backup.js
          node --check sw.js
          node --check worker/index.js
      - name: Test tag migration and import
        run: |
          node tests/tag-store.test.cjs
          node --test tag-store.test.cjs
